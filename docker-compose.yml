# Runs the ITER backend. The web app and HTTPS are added to this file in the deployment phase.
#
#   docker compose up --build -d     start (rebuilds if the code changed)
#   docker compose logs -f server    watch the logs
#   docker compose down              stop
services:
  server:
    build: ./server
    image: iter-server
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
